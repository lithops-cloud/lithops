name: Tests

on:
  pull_request:
    branches:
      - master
    paths:
      - 'setup.py'
      - 'lithops/**'

  workflow_dispatch: 
  # this allows to run the workflow manually through the github dashboard

jobs:

  localhost_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Clone Lithops repository
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install Lithops
        run: |
          pip3 install -U .[tests]

      - name: Run Lithops tests
        run: |
          cd lithops/tests
          pytest -v --backend localhost --storage localhost
