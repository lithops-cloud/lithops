name: Tests all OS

on:
  workflow_dispatch:

jobs:
  localhost_tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Clone Lithops repository
        uses: actions/checkout@v5

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install Redis
        # There is no Redis build for Windows. The tests that need a server
        # skip themselves where none is reachable
        if: runner.os != 'Windows'
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7.x'

      - name: Install Lithops
        run: |
          pip3 install -U .[tests]

      - name: Run Lithops tests
        run: |
          cd lithops/tests
          pytest -v --durations=0 --timeout=120 --timeout-method=thread --backend localhost --storage localhost

      - name: Display last 500 lines of the Lithops log file
        if: cancelled() || failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            log=/tmp/lithops-runner/localhost-runner.log
          elif [ "$RUNNER_OS" == "macOS" ]; then
            log=$TMPDIR/lithops-runner/localhost-runner.log
          else
            log="C:\Users\RUNNER~1\AppData\Local\Temp\lithops-root\localhost-runner.log"
          fi
          # A job that failed before running anything leaves no log, which
          # should not fail this step on top of the failure being reported
          tail -n 500 "$log" || echo "No runner log at $log"
